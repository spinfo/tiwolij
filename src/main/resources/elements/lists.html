<section th:fragment="listAuthors(authors, fields, sortable)" class="row">
	<div class="col-md-12">
		<div class="panel panel-default">
			<div th:text="#{authors}" class="panel-heading"></div>
			<table th:unless="${#lists.isEmpty(authors)}" th:with="params=${queryString}" class="table table-hover">
				<thead>
					<tr>
						<th>
							<div th:remove="tag" th:text="#{fields.id}"></div>
							<a th:if="${#arrays.contains(sortable, 'id')}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=id')}"><span class="caret"></span></a>
						</th>
						<th th:each="field : ${fields}">
							<div th:remove="tag" th:text="#{'fields.' + ${field}}"></div>
							<a th:if="${#arrays.contains(sortable, field)}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=' + __field__)}"><span class="caret"></span></a>
						</th>
						<th th:text="#{actions}" class="text-right"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="author : ${authors}">
						<th th:text="'#' + ${author.id}"></th>
						<div th:each="field : ${fields}" th:remove="tag">
							<td th:if="${field} == 'slug'" th:text="${#strings.abbreviate(author.slug, 25)}"></td>
							<td th:if="${field} == 'image'"><a th:unless="${#lists.isEmpty(author.image)}" target="_blank" th:text="#{actions.view}" th:href="@{/image/author(id=${author.id})}"></a></td>
							<td th:if="${field} == 'works'"><a th:unless="${#lists.isEmpty(author.works)}" th:href="@{/tiwolij/works/list(authorId=${author.id}, page=0, sort=id)}" th:text="#{actions.list} + ' (' + ${#lists.size(author.works)} + ')'"></a></td>
							<td th:if="${field} == 'quotes'"><a th:unless="${#lists.isEmpty(author.quotes)}" th:href="@{/tiwolij/quotes/list(authorId=${author.id}, page=0, sort=id)}" th:text="#{actions.list} + ' (' + ${#lists.size(author.quotes)} + ')'"></a></td>
							<td th:if="${field} == 'names'" class="child-enum"><div th:each="locale : ${author.locales}" th:text="${#strings.abbreviate(locale.name, 25)} + ' (' + ${locale.language} + ')'"></div></td>
							<td th:if="${field} == 'wikidataId'"><a th:unless="${#strings.isEmpty(author.wikidataId)}" target="_blank" th:href="'https://www.wikidata.org/wiki/Q' + ${author.wikidataId}" th:text="'Q' + ${author.wikidataId}"></a></td>
						</div>
						<td class="text-right">
							<a th:text="#{actions.view}" th:href="@{/tiwolij/authors/view(authorId=${author.id})}" role="button" class="btn btn-xs btn-default"></a>
							<a th:text="#{actions.edit}" th:href="@{/tiwolij/authors/edit(authorId=${author.id})}" role="button" class="btn btn-xs btn-primary"></a>
							<a th:text="#{actions.delete}" th:href="@{/tiwolij/authors/delete(authorId=${author.id})}" role="button" class="btn btn-xs btn-danger" data-action="deleteRow"></a>
						</td>
					</tr>
				</tbody>
			</table>
			<div th:if="${#lists.isEmpty(authors)}" class="panel-body"><p th:text="#{backend.empty}" class="text-danger"></p></div>
		</div>
		<div th:if="${page}" th:remove="tag">
			<div th:replace="~{../elements/blocks :: pager}"></div>
		</div>
	</div>
</section>

<section th:fragment="listQuotes(quotes, fields, sortable)" class="row">
	<div class="col-md-12">
		<div class="panel panel-default">
			<div th:text="#{quotes}" class="panel-heading"></div>
			<table th:unless="${#lists.isEmpty(quotes)}" th:with="params=${queryString}" class="table table-hover">
				<thead>
					<tr>
						<th>
							<div th:remove="tag" th:text="#{fields.id}"></div>
							<a th:if="${#arrays.contains(sortable, 'id')}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=id')}"><span class="caret"></span></a>
						</th>
						<th th:each="field : ${fields}">
							<div th:remove="tag" th:text="#{'fields.' + ${field}}"></div>
							<a th:if="${#arrays.contains(sortable, field)}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=' + __field__)}"><span class="caret"></span></a>
						</th>
						<th th:text="#{actions}" class="text-right"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="quote : ${quotes}" th:with="year=${#strings.isEmpty(quote.year)} ? '' : '-' + ${quote.year}, time=${#strings.isEmpty(quote.time)} ? '' : ' ' + ${quote.time}">
						<th th:text="'#' + ${quote.id}"></th>
						<div th:each="field : ${fields}" th:remove="tag">
							<td th:if="${field} == 'schedule'" th:text="${quote.schedule} + ${year} + ${time}"></td>
							<td th:if="${field} == 'language'" th:text="${quote.language}"></td>
							<td th:if="${field} == 'corpus'" th:text="${#strings.abbreviate(quote.corpus, 50)}"></td>
							<td th:if="${field} == 'source'"><a th:unless="${#strings.isEmpty(quote.href)}" th:text="#{actions.view}" th:href="${quote.href}" target="_blank"></a></td>
							<td th:if="${field} == 'meta'" th:text="${quote.meta}"></td>
							<td th:if="${field} == 'curator'" th:text="${quote.curator}"></td>
							<td th:if="${field} == 'locked'"><span th:if="${quote.locked}" class="glyphicon glyphicon-star" aria-hidden="true"></span></td>
							<td th:if="${field} == 'author'" th:text="${#strings.abbreviate(quote.author.slug, 25)}"></td>
							<td th:if="${field} == 'work'" th:text="${#strings.abbreviate(quote.work.slug, 25)}"></td>
						</div>
						<td class="text-right">
							<a th:text="#{actions.view}" th:href="@{/tiwolij/quotes/view(quoteId=${quote.id})}" role="button" class="btn btn-xs btn-default"></a>
							<a th:text="#{actions.edit}" th:href="@{/tiwolij/quotes/edit(quoteId=${quote.id})}" role="button" class="btn btn-xs btn-primary"></a>
							<a th:text="#{actions.delete}" th:href="@{/tiwolij/quotes/delete(quoteId=${quote.id})}" role="button" class="btn btn-xs btn-danger" onclick="return confirm(MESSAGES_BACKEND_CONFIRM)"></a>
						</td>
					</tr>
				</tbody>
			</table>
			<div th:if="${#lists.isEmpty(quotes)}" class="panel-body"><p th:text="#{backend.empty}" class="text-danger"></p></div>
		</div>
		<div th:if="${page}" th:remove="tag">
			<div th:replace="~{../elements/blocks :: pager}"></div>
		</div>
	</div>
</section>

<section th:fragment="listLocales(locales, fields, sortable)" class="row">
	<div class="col-md-12">
		<div class="panel panel-default">
			<div th:text="#{locales}" class="panel-heading"></div>
			<table th:unless="${#lists.isEmpty(locales)}" th:with="params=${queryString}" class="table table-hover">
				<thead>
					<tr>
						<th>
							<div th:remove="tag" th:text="#{fields.id}"></div>
							<a th:if="${#arrays.contains(sortable, 'id')}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=id')}"><span class="caret"></span></a>
						</th>
						<th th:each="field : ${fields}">
							<div th:remove="tag" th:text="#{'fields.' + ${field}}"></div>
							<a th:if="${#arrays.contains(sortable, field)}" th:href="'?' + ${params.replaceFirst('sort=[^&amp;]+', 'sort=' + __field__)}"><span class="caret"></span></a>
						</th>
						<th th:text="#{actions}" class="text-right"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="locale : ${locales}">
						<th th:text="'#' + ${locale.id}"></th>
						<div th:each="field : ${fields}" th:remove="tag">
							<td th:if="${field} == 'parent'">
								<a th:if="${locale.author}" th:href="@{/tiwolij/authors/view(authorId=${locale.author.id})}" th:text="${#strings.abbreviate(locale.author.slug, 25)}"></a>
								<a th:if="${locale.work}" th:href="@{/tiwolij/authors/view(authorId=${locale.work.id})}" th:text="${#strings.abbreviate(locale.work.slug, 25)}"></a>
							</td>
							<td th:if="${field} == 'language'" th:text="${locale.language}"></td>
							<td th:if="${field} == 'name'" th:text="${locale.name}"></td>
							<td th:if="${field} == 'source'"><a th:unless="${#strings.isEmpty(locale.href)}" th:text="#{actions.view}" th:href="${locale.href}" target="_blank"></a></td>
						</div>
						<td class="text-right">
							<a th:text="#{actions.view}" th:href="@{/tiwolij/locales/view(localeId=${locale.id})}" role="button" class="btn btn-xs btn-default"></a>
							<a th:text="#{actions.edit}" th:href="@{/tiwolij/locales/edit(localeId=${locale.id})}" role="button" class="btn btn-xs btn-primary"></a>
							<a th:text="#{actions.delete}" th:href="@{/tiwolij/locales/delete(localeId=${locale.id})}" role="button" class="btn btn-xs btn-danger" onclick="return confirm(MESSAGES_BACKEND_CONFIRM)"></a>
						</td>
					</tr>
				</tbody>
			</table>
			<div th:if="${#lists.isEmpty(locales)}" class="panel-body"><p th:text="#{backend.empty}" class="text-danger"></p></div>
		</div>
		<div th:if="${page}" th:remove="tag">
			<div th:replace="~{../elements/blocks :: pager}"></div>
		</div>
	</div>
</section>

<section th:fragment="listErrors(errors)" class="row" th:unless="${#maps.isEmpty(errors)}">
	<div class="col-md-12">
		<div class="panel panel-danger">
			<div th:text="#{fields.errors}" class="panel-heading"></div>
			<table class="table table-hover">
				<thead>
					<tr>
						<th th:text="#{fields.line}"></th>
						<th th:text="#{fields.error}"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="error : ${errors}">
						<th th:text="${error.key}"></th>
						<td th:text="${error.value.message}" class="small"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>
</section>
