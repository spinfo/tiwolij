<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{backend.searchresults})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section th:replace="~{../elements/lists :: listAuthors(${authors}, ${#strings.arraySplit('wikidataId,slug,names,image,works,quotes', ',')}, '')}"></section>
		<section th:replace="~{../elements/lists :: listWorks(${works}, ${#strings.arraySplit('wikidataId,author,slug,names,quotes', ',')}, '')}"></section>
		<section th:replace="~{../elements/lists :: listQuotes(${quotes}, ${#strings.arraySplit('language,schedule,corpus,source,meta,locked', ',')}, '')}"></section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
