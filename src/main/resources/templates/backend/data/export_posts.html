<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{data.export.posts})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section class="row">
			<div class="col-md-12">
				<div class="panel panel-default">
					<div th:text="#{data.export.posts}" class="panel-heading"></div>
					<form class="form-horizontal" method="post">
						<div class="panel-body">
							<div th:replace="~{../elements/fields :: fieldCheckbox('onlyfinal')}"></div>
							<div th:replace="~{../elements/fields :: fieldSelect('onlylang', false, ${languages}, '', '')}"></div>
							<div th:replace="~{../elements/fields :: fieldSelect('onlymonth', false, ${months}, 'key', 'value')}"></div>
						</div>
						<div class="panel-footer text-right">
							<button th:text="#{data.export.posts}" th:formaction="@{/tiwolij/data/export/posts}" type="submit" class="btn btn-sm btn-success"></button>
						</div>
					</form>
				</div>
			</div>
		</section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
