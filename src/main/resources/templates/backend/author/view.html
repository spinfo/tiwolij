<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{authors.view})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section class="row">
			<div class="col-md-12">
				<div class="panel panel-default">
					<div th:text="#{authors.view} + ' #' + ${author.id}" class="panel-heading"></div>
					<form th:object="${author}" class="form-horizontal">
						<div class="panel-body">
							<div th:unless="*{#strings.isEmpty(wikidataId)}"><div th:replace="~{../elements/fields :: fieldView('wikidataId', 'Q' + *{wikidataId}, @{https://www.wikidata.org/wiki/Q} + *{wikidataId}, true)}"></div></div>
							<div th:replace="~{../elements/fields :: fieldView('slug', *{slug}, '', false)}"></div>
							<div th:unless="*{#lists.isEmpty(image)}"><div th:replace="~{../elements/fields :: fieldView('image', #{actions.view}, @{/image/author(id=*{id})}, true)}"></div></div>
							<div th:unless="*{#lists.isEmpty(image)}"><div th:replace="~{../elements/fields :: fieldView('imageAttribution', *{imageAttribution}, '', false)}"></div></div>
						</div>
						<div class="panel-footer text-right">
							<a th:text="#{locales.create}" th:href="@{/tiwolij/locales/create(authorId=*{id})}" role="button" class="btn btn-sm btn-success"></a>
							<a th:unless="*{#strings.isEmpty(wikidataId)}" th:text="#{locales.import}" th:href="@{/tiwolij/data/import/locales(authorId=*{id})}" role="button" class="btn btn-sm btn-success"></a>
							<a th:text="#{works.create}" th:href="@{/tiwolij/works/create(authorId=*{id})}" role="button" class="btn btn-sm btn-success"></a>
							<a th:text="#{authors.edit}" th:href="@{/tiwolij/authors/edit(authorId=*{id})}" role="button" class="btn btn-sm btn-primary"></a>
							<a th:text="#{authors.delete}" th:href="@{/tiwolij/authors/delete(authorId=*{id})}" role="button" class="btn btn-sm btn-danger" onclick="return confirm(MESSAGES_BACKEND_CONFIRM)"></a>
						</div>
					</form>
				</div>
			</div>
		</section>
		<section th:replace="~{../elements/lists :: listWorks(${author.works}, ${#strings.arraySplit('wikidataId,slug,quotes', ',')}, '')}"></section>
		<section th:replace="~{../elements/lists :: listQuotes(${author.quotes}, ${#strings.arraySplit('work,language,schedule,corpus', ',')}, '')}"></section>
		<section th:replace="~{../elements/lists :: listLocales(${author.locales}, ${#strings.arraySplit('language,name,source', ',')}, '')}"></section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
