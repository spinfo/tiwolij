<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{locales.create})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section class="row">
			<div class="col-md-12">
				<div class="panel panel-default">
					<div th:text="#{locales.create}" class="panel-heading"></div>
					<form th:object="${locale}" class="form-horizontal" method="post">
						<div class="panel-body">
							<div th:unless="*{work}"><div th:replace="~{../elements/fields :: fieldSelect('author', false, ${authors}, 'id', 'slug')}"></div></div>
							<div th:unless="*{author}"><div th:replace="~{../elements/fields :: fieldSelect('work', false, ${works}, 'id', 'slug')}"></div></div>
							<div th:replace="~{../elements/fields :: fieldInput('language', true, 'text', 2, '^[a-z]{2}$')}"></div>
							<div th:replace="~{../elements/fields :: fieldInput('name', true, 'text', 255, '')}"></div>
							<div th:replace="~{../elements/fields :: fieldInput('href', false, 'url', 255, '')}"></div>
						</div>
						<div class="panel-footer text-right">
							<button th:text="#{locales.create}" th:formaction="@{/tiwolij/locales/create}" type="submit" class="btn btn-sm btn-success"></button>
						</div>
					</form>
				</div>
			</div>
		</section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
