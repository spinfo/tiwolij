<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{works.create})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section class="row">
			<div class="col-md-12">
				<div class="panel panel-default">
					<div th:text="#{works.create}" class="panel-heading"></div>
					<form th:object="${work}" class="form-horizontal" method="post">
						<div class="panel-body">
							<div th:replace="~{../elements/fields :: fieldEnter('wikidataId', false, 'number', '', '\d+', 'Q', @{/tiwolij/data/import/work}, #{fields.import})}"></div>
							<div th:replace="~{../elements/fields :: fieldSelect('author', true, ${authors}, 'id', 'slug')}"></div>
							<div th:replace="~{../elements/fields :: fieldInput('slug', true, 'text', 255, '')}"></div>
						</div>
						<div class="panel-footer text-right">
							<button th:text="#{works.create}" th:formaction="@{/tiwolij/works/create}" type="submit" class="btn btn-sm btn-success"></button>
						</div>
					</form>
				</div>
			</div>
		</section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
