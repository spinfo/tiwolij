<!doctype html>
<html class="no-js" lang="en">

<head th:replace="~{../elements/blocks :: header(title=#{works.edit})}"></head>

<body id="backend">
	<div class="container">
		<nav th:replace="~{../elements/navbar}"></nav>
		<section class="row">
			<div class="col-md-12">
				<div class="panel panel-default">
					<div th:text="#{works.edit} + ' #' + ${work.id}" class="panel-heading"></div>
					<form th:object="${work}" class="form-horizontal" method="post">
						<input th:field="*{id}" type="hidden" />
						<input th:unless="*{#strings.isEmpty(wikidataId)}" th:field="*{wikidataId}" type="hidden" />
						<div class="panel-body">
							<div th:unless="*{#strings.isEmpty(wikidataId)}"><div th:replace="~{../elements/fields :: fieldView('wikidataId', 'Q' + *{wikidataId}, @{https://www.wikidata.org/wiki/Q} + *{wikidataId}, true)}"></div></div>
							<div th:if="*{#strings.isEmpty(wikidataId)}"><div th:replace="~{../elements/fields :: fieldEnter('wikidataId', false, 'number', '', '\d+', 'Q', '', '')}"></div></div>
							<div th:replace="~{../elements/fields :: fieldSelect('author', true, ${authors}, 'id', 'slug')}"></div>
							<div th:replace="~{../elements/fields :: fieldInput('slug', true, 'text', 255, '')}"></div>
						</div>
						<div class="panel-footer text-right">
							<button th:text="#{works.edit}" th:formaction="@{/tiwolij/works/edit}" type="submit" class="btn btn-sm btn-success"></button>
							<a th:text="#{works.delete}" th:href="@{/tiwolij/works/delete(workId=*{id})}" role="button" class="btn btn-sm btn-danger" onclick="return confirm(MESSAGES_BACKEND_CONFIRM)"></a>
						</div>
					</form>
				</div>
			</div>
		</section>
	</div>
	<footer th:replace="~{../elements/blocks :: footer}"></footer>
</body>

</html>
